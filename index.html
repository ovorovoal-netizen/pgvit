<div id="map"></div>
<button class="geo-btn" onclick="findMyLocation()">📍</button>

<script src="https://unpkg.com"></script>
<script>
    // Инициализация карты Минска
    const map = L.map('map').setView([53.9000, 27.5667], 13);

    // Загрузка карты улиц
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Ваши точки на карте (Сюда можно добавлять свои новые гидранты)
    const myPoints = [
      {
        "type": "Feature",
        "properties": { "name": "Гидрант №1", "info": "Улица Ленина, д. 5" },
        "geometry": { "type": "Point", "coordinates": [27.5615, 53.9023] } 
      },
      {
        "type": "Feature",
        "properties": { "name": "Гидрант №2", "info": "Проспект Независимости, д. 12" },
        "geometry": { "type": "Point", "coordinates": [27.5670, 53.9005] } 
      }
    ];

    // Рисуем маркеры на карте
    myPoints.forEach(point => {
        const lng = point.geometry.coordinates[0];
        const lat = point.geometry.coordinates[1];
        const marker = L.marker([lat, lng]).addTo(map);
        marker.bindPopup(`
            <div style="min-width: 150px; font-family: sans-serif;">
                <h3 style="margin: 0 0 5px 0; color: #d32f2f;">${point.properties.name}</h3>
                <p style="margin: 0; color: #333;">${point.properties.info}</p>
            </div>
        `);
    });

    // Функция GPS геолокации
    let userMarker = null;
    function findMyLocation() {
        map.locate({setView: true, maxZoom: 17});
    }
    map.on('locationfound', function(e) {
        if (userMarker) {
            userMarker.setLatLng(e.latlng);
        } else {
            userMarker = L.circleMarker(e.latlng, {
                radius: 9, fillColor: '#007bff', color: '#fff', weight: 3, opacity: 1, fillOpacity: 0.8
            }).addTo(map).bindPopup("Вы здесь");
        }
    });
    map.on('locationerror', function(e) {
        alert("Пожалуйста, включите GPS на телефоне для определения координат.");
    });
</script>
