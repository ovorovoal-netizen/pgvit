<div id="map"></div>
<button class="geo-btn" onclick="findMyLocation()">📍</button>

<script src="https://unpkg.com"></script>
<script>
    // Инициализируем карту
    const map = L.map('map').setView([53.9000, 27.5667], 13);

    // Подключаем карту улиц
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    // Список ваших точек (Координаты в формате [долгота, широта])
    const myPoints = [
      {
        "type": "Feature",
        "properties": { "name": "Гидрант №1", "info": "Улица Ленина, д. 5" },
        "geometry": { "type": "Point", "coordinates": [27.5615, 53.9023] } 
      },
      {
        "type": "Feature",
        "properties": { "name": "Гидрант №2", "info": "Проспект Независимости, д. 12" },
        "geometry": { "type": "Point", "coordinates": [27.5670, 53.9005] } 
      }
    ];

    // Перебираем точки и ставим маркеры
    myPoints.forEach(point => {
        const lng = point.geometry.coordinates[0];
        const lat = point.geometry.coordinates[1];
        
        const marker = L.marker([lat, lng]).addTo(map);
        marker.bindPopup(`<b>${point.properties.name}</b><br>${point.properties.info}`);
    });

    // Функция GPS
    let userMarker = null;
    function findMyLocation() {
        map.locate({setView: true, maxZoom: 17});
    }
    map.on('locationfound', function(e) {
        if (userMarker) {
            userMarker.setLatLng(e.latlng);
        } else {
            userMarker = L.circleMarker(e.latlng, { radius: 9, fillColor: '#007bff', color: '#fff', weight: 3 }).addTo(map);
        }
    });
</script>
