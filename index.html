<!DOCTYPE html> <html lang=«ru»> <head> <meta charset=«UTF-8»> <meta name=«viewport»content=«width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no»> <title>Моя Карта Объектов</title> <link rel=«manifest» href=«manifest.json»> <linkrel=«stylesheet» href=«https://unpkg.com» /> <style> body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; } #map { width: 100%; height: 100vh; } .geo-btn { position: absolute; bottom: 20px; right: 20px; z-index: 1000; background: #ffffff; border: none; border-radius: 50%; width: 56px; height: 56px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; } .geo-btn:active { background: #f0f0f0; } </style> </head> <body> <div id=«map»></div> <button class=«geo-btn» onclick=«findMyLocation()»>📍</button> <scriptsrc=«https://unpkg.com»></script> <script> const map = L.map(‘map’).setView([53.9000, 27.5667], 13); L.tileLayer(‘https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png’, { maxZoom: 19, attribution: ‘© OpenStreetMap’ }).addTo(map); const myPoints = [ { «type»: «Feature»,»properties»: { «name»: «Гидрант №1», «info»: «Улица Ленина, д. 5» }, «geometry»: { «type»: «Point», «coordinates»: [27.5615, 53.9023] } }, { «type»: «Feature», «properties»: { «name»: «Гидрант №2», «info»: «Проспект Независимости, д. 12» }, «geometry»: { «type»: «Point», «coordinates»: [27.5670, 53.9005] } } ]; myPoints.forEach(point => { const lng = point.geometry.coordinates[0]; const lat = point.geometry.coordinates[1]; const marker = L.marker([lat, lng]).addTo(map); marker.bindPopup(` <div style=«min-width: 150px; font-family: sans-serif;»> <h3 style=«margin: 0 0 5px 0; color: #d32f2f;»>${point.properties.name}</h3> <p style=«margin: 0; color: #333;»>${point.properties.info}</p> </div> `); }); let userMarker = null; function findMyLocation() { map.locate({setView: true, maxZoom: 17}); } map.on(‘locationfound’, function(e) { if (userMarker) { userMarker.setLatLng(e.latlng); } else { userMarker = L.circleMarker(e.latlng, { radius: 9, fillColor: ‘#007bff’, color: ‘#fff’, weight: 3, opacity: 1, fillOpacity: 0.8 }).addTo(map).bindPopup(«Вы здесь»); } }); map.on(‘locationerror’, function(e) { alert(«Не удалось определить координаты. Включите GPS.»); }); </script> </body> </html>
